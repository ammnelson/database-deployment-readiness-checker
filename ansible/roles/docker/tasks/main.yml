---
- name: Install Docker
  ansible.builtin.apt:
    name: docker.io
    state: present

- name: Add ubuntu and jenkins users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop:
    - ubuntu
    - jenkins
  notify: Restart Jenkins to pick up docker group

- name: Ensure Docker is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
