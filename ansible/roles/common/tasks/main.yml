---
# Base setup every other role relies on
- name: Update apt cache (max once an hour)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: dist

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - python3-venv
      - git
      - curl
      - unzip
    state: present

- name: Install AWS CLI (snap - not packaged in Ubuntu 24.04 apt)
  ansible.builtin.command:
    cmd: snap install aws-cli --classic
  args:
    creates: /snap/bin/aws
